{% extends 'base.html' %}

{% block content %}
<section class="page-hero compact">
  <div class="container">
    <span class="eyebrow">Contact</span>
    <h1>Let’s talk supply, retail or hospitality enquiries</h1>
  </div>
</section>

<section class="section">
  <div class="container contact-grid">
    <div class="contact-card">
      <h2>Get in touch</h2>
      <p><strong><span class="inline-icon" aria-hidden="true">☎</span> Phone:</strong> <a href="tel:+919342328664">{{ site.brand.phone }}</a></p>
      <p><strong><span class="inline-icon" aria-hidden="true">✉</span> Email:</strong> <a href="mailto:hello@ricevibe.in">{{ site.brand.email }}</a></p>
      <p><strong><span class="inline-icon" aria-hidden="true">⌖</span> Address:</strong> {{ site.brand.address }}</p>
      <div class="social-row">
        <a href="{{ site.social.whatsapp }}" target="_blank" rel="noreferrer" aria-label="WhatsApp" title="WhatsApp"><svg class="social-icon" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"/><path d="M9 8.5c.2 2.3 2 4.3 4.3 4.8l1.2-1.2 1.8.8c-.2 1.3-1.2 1.9-2.3 1.7-3.7-.7-6.3-3.3-7-7-.2-1.1.5-2.1 1.7-2.3l.8 1.8L9 8.5Z"/></svg></a>
        <a href="{{ site.social.instagram }}" target="_blank" rel="noreferrer" aria-label="Instagram" title="Instagram"><svg class="social-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" class="fill-dot"/></svg></a>
        <a href="{{ site.social.facebook }}" target="_blank" rel="noreferrer" aria-label="Facebook" title="Facebook"><svg class="social-icon" viewBox="0 0 24 24"><path d="M14 21v-8h3l.5-3H14V8.2c0-.9.3-1.5 1.6-1.5H18V4.1c-.4-.1-1.3-.2-2.5-.2-2.5 0-4.2 1.5-4.2 4.2V10H8.5v3H11v8"/></svg></a>
      </div>
    </div>

    <form class="contact-form" novalidate>
      <div class="two-field-grid">
        <label>
          <span>Name</span>
          <input type="text" name="name" required />
        </label>
        <label>
          <span>Phone</span>
          <input type="tel" name="phone" required />
        </label>
      </div>
      <div class="two-field-grid">
        <label>
          <span>Email</span>
          <input type="email" name="email" required />
        </label>
        <label>
          <span>Company</span>
          <input type="text" name="company" />
        </label>
      </div>
      <label>
        <span>Enquiry type</span>
        <select name="enquiryType">
          {% for type in site.contact_form_types %}
          <option value="{{ type }}">{{ type }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span>Message</span>
        <textarea name="message" rows="5" required>{% if selected_product %}I would like an enquiry for {{ selected_product }}.{% endif %}</textarea>
      </label>
      <button class="btn primary" type="submit">Send enquiry</button>
      <p class="form-status" aria-live="polite"></p>
    </form>
  </div>
</section>
{% endblock %}
